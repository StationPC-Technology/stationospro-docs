name: Deploy

# push main 自动部署（含合并翻译 PR）；workflow_dispatch 用于手动重发/应急
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/stationpc/stationnas-docs:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stationpc/stationnas-docs:${{ github.sha }}
            ghcr.io/stationpc/stationnas-docs:latest
          # NEXT_PUBLIC_* 为构建时内联变量（仓库 variables）
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

  deploy:
    name: Deploy via Alibaba Cloud Assistant
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ALIYUN_REGION: ${{ vars.ALIYUN_REGION }}
      # Aliyun CLI v3 在解析 endpoint/凭据前要求全局 region；
      # 仅传 --RegionId 参数不够，缺少此项会以 exit code 3 报 "region can't be empty"
      ALIBABA_CLOUD_REGION_ID: ${{ vars.ALIYUN_REGION }}
      ECS_INSTANCE_ID: ${{ vars.ECS_INSTANCE_ID }}
      IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy variables
        run: |
          for name in ALIYUN_REGION ECS_INSTANCE_ID IMAGE; do
            [ -n "${!name}" ] || { echo "ERROR: $name is empty (check repository Variables)"; exit 1; }
          done
          echo "region=$ALIYUN_REGION instance=$ECS_INSTANCE_ID image=$IMAGE"

      - name: Install Alibaba Cloud CLI
        run: |
          /bin/bash -c "$(curl -fsSL https://aliyuncli.alicdn.com/install.sh)"
          aliyun version

      - name: Configure credentials via GitHub OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_ROLE_ARN }}
          role-session-name: github-actions-deploy-${{ github.run_id }}
          role-session-expiration: 3600
          audience: sts.aliyuncs.com

      - name: "Preflight: Cloud Assistant status"
        run: |
          aliyun sts GetCallerIdentity
          aliyun ecs DescribeCloudAssistantStatus \
            --RegionId "$ALIYUN_REGION" \
            --InstanceId.1 "$ECS_INSTANCE_ID" \
            | jq -e '.InstanceCloudAssistantStatusSet.InstanceCloudAssistantStatus[0]
                     | select((.CloudAssistantStatus | tostring) == "true")'

      - name: Deploy through RunCommand
        run: |
          {
            head -n 1 scripts/deploy-remote.sh
            printf "export IMAGE='%s'\n" "$IMAGE"
            tail -n +2 scripts/deploy-remote.sh
          } > /tmp/deploy-remote.sh
          SCRIPT_B64="$(base64 -w0 /tmp/deploy-remote.sh)"
          echo "command bytes (base64): ${#SCRIPT_B64}"

          RESP="$(aliyun ecs RunCommand \
            --RegionId "$ALIYUN_REGION" \
            --InstanceId.1 "$ECS_INSTANCE_ID" \
            --Type RunShellScript \
            --ContentEncoding Base64 \
            --CommandContent "$SCRIPT_B64" \
            --Timeout 1800)"
          echo "$RESP"
          INVOKE_ID="$(echo "$RESP" | jq -r '.InvokeId')"
          [ -n "$INVOKE_ID" ] && [ "$INVOKE_ID" != "null" ] || { echo "No InvokeId"; exit 1; }

          for i in $(seq 1 360); do
            sleep 5
            RESULT="$(aliyun ecs DescribeInvocationResults \
              --RegionId "$ALIYUN_REGION" \
              --InvokeId "$INVOKE_ID" \
              --InstanceId "$ECS_INSTANCE_ID" \
              --ContentEncoding PlainText 2>/dev/null || true)"
            STATUS="$(echo "$RESULT" | jq -r '.Invocation.InvocationResults.InvocationResult[0].InvocationStatus // empty')"
            EXIT_CODE="$(echo "$RESULT" | jq -r '.Invocation.InvocationResults.InvocationResult[0].ExitCode // empty')"
            echo "[$i] status=$STATUS exitCode=$EXIT_CODE"
            case "$STATUS" in
              Success)
                echo "$RESULT" | jq -r '.Invocation.InvocationResults.InvocationResult[0].Output // empty'
                if [ "${EXIT_CODE:-0}" != "0" ]; then
                  echo "Command exited with $EXIT_CODE"
                  exit 1
                fi
                exit 0
                ;;
              Failed|Error|Timeout|Cancelled|Terminated|Stopped|Invalid|Aborted)
                echo "$RESULT" | jq -r '.Invocation.InvocationResults.InvocationResult[0].Output // empty'
                echo "$RESULT" | jq -r '.Invocation.InvocationResults.InvocationResult[0].ErrorInfo // empty'
                echo "Cloud Assistant invocation failed: $STATUS"
                exit 1
                ;;
              Pending|Running|Stopping|Scheduled|"")
                ;;
              *)
                echo "Unexpected status: $STATUS"
                ;;
            esac
          done
          echo "Timed out waiting for Cloud Assistant invocation $INVOKE_ID"
          exit 1
